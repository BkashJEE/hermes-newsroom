<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Hermes Newsroom</title>
  <desc>An edition: one lead story above the rest, ranked.</desc>
  <rect width="1024" height="1024" rx="232" fill="#11151a"/>
  <!-- The lead. Accent is the only coloured surface, as on the page itself. -->
  <rect x="222" y="256" width="580" height="94" rx="18" fill="#2f81f7"/>
  <!-- What follows it, shorter each time: the ranking is the product. -->
  <rect x="222" y="452" width="580" height="60" rx="16" fill="#8b949e"/>
  <rect x="222" y="576" width="444" height="60" rx="16" fill="#8b949e"/>
  <rect x="222" y="700" width="290" height="60" rx="16" fill="#4d5560"/>
</svg>
